name: Build & Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'fastlane/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import tomllib
          from pathlib import Path

          versions = tomllib.loads(Path('gradle/mihon.versions.toml').read_text())['versions']
          sdk_root = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          sdkmanager = shutil.which('sdkmanager')
          if not sdkmanager:
              candidates = [sdk_root / 'cmdline-tools/latest/bin/sdkmanager']
              candidates.extend(sorted(sdk_root.glob('cmdline-tools/*/bin/sdkmanager'), reverse=True))
              sdkmanager = next(str(path) for path in candidates if path.is_file())
          subprocess.run([
              sdkmanager,
              f"platforms;android-{versions['android-sdk-compile']}",
              'build-tools;37.0.0',
              f"ndk;{versions['android-ndk']}",
          ], check=True)
          PY

      - name: Check format, unit tests and database migrations
        id: checks
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          spotlessCheck testDebugUnitTest verifySqlDelightMigration
          -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false

      - name: Upload test reports
        if: always() && steps.checks.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/'
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare signing keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the repository signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mihon-miuix.keystore"

      - name: Build signed APKs
        if: github.event_name != 'pull_request'
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleRelease
          -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false
        env:
          MIHON_GITHUB_RELEASE: 'true'
          storeFile: ${{ runner.temp }}/mihon-miuix.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihon-miuix-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/mihon-miuix.keystore"
