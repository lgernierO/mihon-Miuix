name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the repository signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mihon-miuix.keystore"

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import tomllib
          from pathlib import Path

          versions = tomllib.loads(Path('gradle/mihon.versions.toml').read_text())['versions']
          sdk_root = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          sdkmanager = shutil.which('sdkmanager')
          if not sdkmanager:
              candidates = [sdk_root / 'cmdline-tools/latest/bin/sdkmanager']
              candidates.extend(sorted(sdk_root.glob('cmdline-tools/*/bin/sdkmanager'), reverse=True))
              sdkmanager = next(str(path) for path in candidates if path.is_file())
          subprocess.run([
              sdkmanager,
              f"platforms;android-{versions['android-sdk-compile']}",
              'build-tools;37.0.0',
              f"ndk;{versions['android-ndk']}",
          ], check=True)
          PY

      - name: Check format, unit tests and database migrations
        id: checks
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          spotlessCheck testDebugUnitTest verifySqlDelightMigration
          -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false

      - name: Upload test reports
        if: always() && steps.checks.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports-${{ github.sha }}
          path: '**/build/reports/tests/'
          if-no-files-found: warn
          retention-days: 7

      - name: Build signed APKs
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleRelease
          -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false
        env:
          MIHON_GITHUB_RELEASE: 'true'
          storeFile: ${{ runner.temp }}/mihon-miuix.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release files
        run: |
          mkdir -p release
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "release/mihon-miuix-$abi.apk"
          done
          cp app/build/outputs/mapping/release/mapping.txt release/mapping.txt
          cd release
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihon-miuix-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Mihon Miuix ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/mapping.txt
            release/SHA256SUMS

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mihon-miuix.keystore"
