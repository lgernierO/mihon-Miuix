kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
# Miuix's publication/format plugins read root-project files during configuration.
# Composite source builds currently require ordinary project configuration.
org.gradle.isolated-projects=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
